  /accounts/{accountId}/transactions/deposits/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      summary: Get a deposit transaction
      description: Returns a transaction belonging to the specified account and transaction type. Returns 404 if no matching transaction exists.
      operationId: getDeposit
      responses:
        '200':
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ProcessingError'
    put:
      tags: [Transactions]
      summary: Replace a pending deposit transaction
      description: >-
        Replaces all editable fields using the same validation as creation. Omitted
        optional fields are cleared. The transaction must belong to the specified
        account and transaction type; otherwise returns 404. Only PENDING transactions
        can be replaced; other states return 409. The transactionId, createdAt, and
        status are preserved. This operation does not create a missing transaction.
      operationId: updateDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/ProcessingError'
    delete:
      tags: [Transactions]
      summary: Delete a pending deposit transaction
      description: >-
        Removes a PENDING transaction from this API and prevents its processing.
        The transaction must belong to the specified account and transaction type;
        otherwise returns 404. Other states return 409. Subsequent reads, updates,
        and deletes return 404, and the transaction is excluded from lists.
        Internal audit records are retained.
      operationId: deleteDeposit
      responses:
        '204':
          description: Transaction deleted successfully. No response body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
