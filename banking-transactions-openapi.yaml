openapi: 3.0.3
info:
  title: Banking Transactions API
  version: 1.1.0
  description: >-
    API for processing banking transactions including deposits, withdrawals,
    refunds, checks, and payments. Supports creation, listing, and retrieval,
    plus replacement and deletion of pending transactions.
servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://sandbox.api.example.com/v1
    description: Sandbox server
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health
      description: Returns whether the service is ready to accept requests. No authentication is required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy and ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
        '503':
          description: Service is unhealthy or temporarily unable to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN

  /accounts/{accountId}/transactions/deposits:
    get:
      tags: [Transactions]
      summary: List deposits
      operationId: listDeposits
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Transactions ordered by createdAt descending, then transactionId ascending. An empty collection returns an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ProcessingError'
    post:
      tags:
        - Transactions
      summary: Create a deposit transaction
      operationId: createDeposit
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier. Must be exactly 10 characters.
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: '^[A-Za-z0-9]{10}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/ProcessingError'

  /accounts/{accountId}/transactions/withdrawals:
    get:
      tags: [Transactions]
      summary: List withdrawals
      operationId: listWithdrawals
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
