      summary: Create a withdrawal transaction
      operationId: createWithdrawal
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier. Must be exactly 10 characters.
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: '^[A-Za-z0-9]{10}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: Withdrawal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
